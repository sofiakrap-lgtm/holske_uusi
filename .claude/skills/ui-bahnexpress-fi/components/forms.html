<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms · ui-bahnexpress-fi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Figtree:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../motion/motion.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-weight:var(--weight-body);font-size:var(--text-body);line-height:var(--leading-body);font-feature-settings:var(--body-features);-webkit-font-smoothing:antialiased}
.demo-label{font:600 14px/20px var(--font-mono);color:var(--color-text-muted);margin:0 0 var(--space-4)}
.demo{padding:var(--space-9) var(--container-pad);display:flex;flex-direction:column;gap:var(--space-9)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center}
.section{background:var(--color-bg);color:var(--color-text);padding:var(--section-py) 0;overflow-x:clip}
.container{max-width:var(--container-max);margin:0 auto;padding-inline:var(--container-pad);display:flex;flex-direction:column;gap:var(--section-gap)}
.display{font-family:var(--font-display);font-stretch:var(--stretch-display);font-size:var(--text-h1);line-height:var(--leading-h1);letter-spacing:var(--tracking-h1);font-weight:var(--weight-h1);text-transform:var(--case-display);color:var(--color-heading);text-wrap:balance;margin:0}
.heading{font-family:var(--font-heading);font-stretch:var(--stretch-display);font-size:var(--text-h3);line-height:var(--leading-h3);letter-spacing:var(--tracking-h3);font-weight:var(--weight-h3);color:var(--color-heading);text-wrap:balance;margin:0}
.eyebrow{font-family:var(--font-body);font-weight:var(--weight-caption);font-size:var(--text-caption);line-height:var(--leading-caption);color:var(--color-text-muted);margin:0}
.lead{font-weight:var(--weight-lead);font-size:var(--text-lead);line-height:var(--leading-lead);color:var(--color-heading);margin:0;text-wrap:balance}
.body{margin:0;text-wrap:pretty}
.muted{color:var(--color-text-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--button-gap);height:var(--button-h);padding:0 var(--button-px);border:0;border-radius:var(--radius-button);font:var(--weight-button) var(--text-button)/var(--leading-button) var(--font-body);white-space:nowrap;cursor:pointer;text-decoration:none;background:transparent;color:inherit;transition:background-color var(--duration-fast),color var(--duration-fast)}
.btn:focus-visible{outline:4px solid var(--color-focus);outline-offset:0}
.btn--primary{background:var(--color-accent);color:var(--color-accent-contrast)}
.btn--primary:hover,.btn--primary.is-hover{background:var(--color-accent-hover)}
.btn--secondary{background:var(--color-surface);color:var(--color-heading)}
.btn--secondary:hover,.btn--secondary.is-hover{background:var(--palette-grey-100)}
.btn--tertiary{background:var(--palette-grey-100);color:var(--palette-asphalt)}
.btn--tertiary:hover,.btn--tertiary.is-hover{background:var(--palette-grey-200)}
.btn--ghost{color:var(--color-heading);padding-inline:calc(var(--button-px) - 2px)}
.btn--ghost:hover,.btn--ghost.is-hover{color:var(--color-link-hover)}
.btn--xs{--button-h:40px;--button-px:20px;--text-button:16px;--leading-button:16px}
.btn--sm{--button-h:48px;--button-px:22px;--text-button:18px;--leading-button:18px}
.btn--lg{--button-h:64px;--button-px:28px;--text-button:22px;--leading-button:22px}
.btn--xl{--button-h:72px;--button-px:32px;--text-button:24px;--leading-button:24px}
.btn--icon{width:var(--button-h);padding:0}
.btn:disabled{background:var(--color-bg-alt);color:var(--color-text-muted);cursor:not-allowed}
.icon{width:var(--icon-size);height:var(--icon-size);fill:none;stroke:currentColor;stroke-width:var(--icon-stroke);stroke-linecap:square;stroke-linejoin:miter;flex:0 0 auto}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid currentColor;border-radius:var(--radius-pill);font:400 16px/16px var(--font-body);color:var(--color-text-muted);white-space:nowrap}
.ph{background:var(--palette-grey-100);display:block;width:100%}

.notch{fill:var(--input-surface,var(--color-surface));flex:0 0 auto;display:block;overflow:visible}
.field{display:flex;align-items:center;gap:12px;width:100%;min-height:var(--input-h);padding:12px var(--input-px);background:var(--input-surface,var(--color-surface));border-radius:var(--radius-input);cursor:text}
.field:has(:focus-visible),.field.is-focus{outline:4px solid var(--color-focus)}
.field--error{box-shadow:inset 0 0 0 3px var(--color-danger)}
.field__media{width:32px;height:32px;color:var(--color-text-muted);display:flex;align-items:center;justify-content:center}
.field__media .icon{width:28px;height:28px;stroke-width:1.75}
.field__body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:gap .2s var(--ease-standard)}
.field__label{font:var(--weight-label) var(--text-label)/var(--leading-label) var(--font-body);color:var(--color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field__value{height:24px;overflow:hidden;transition:height .2s var(--ease-standard),opacity .14s}
.input{width:100%;height:24px;border:0;outline:0;background:transparent;padding:0;font:400 18px/24px var(--font-body);color:var(--palette-grey-950)}
.input::placeholder{color:var(--palette-grey-300)}
.field:not(:focus-within):has(.input:placeholder-shown) .field__value{height:0;opacity:0}
.field:not(:focus-within):has(.input:placeholder-shown) .field__body{gap:0}
.quote-bar{display:flex;flex-direction:column;align-items:stretch;gap:16px;max-width:960px;margin:0 auto}
.quote-bar__group{display:flex;flex-direction:column;align-items:stretch}
.quote-bar__group .notch--row{display:none}
.quote-bar__group .notch--col{align-self:center}
.quote-bar .btn{--button-h:64px;--button-px:28px;--text-button:22px;--leading-button:22px}
@media (min-width:768px) and (max-width:1024px){.quote-bar{max-width:480px}}
@media (min-width:1025px){.quote-bar,.quote-bar__group{flex-direction:row;align-items:center}.quote-bar__group{flex:1}.quote-bar__group .field{flex:1}.quote-bar__group .notch--row{display:block}.quote-bar__group .notch--col{display:none}.quote-bar .btn{--button-h:72px;--button-px:32px;--text-button:24px;--leading-button:24px}}
.slider{appearance:none;-webkit-appearance:none;width:100%;height:24px;background:transparent;margin:0;cursor:pointer;--fill:40%}
.slider::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(to right,var(--color-slider-spent) var(--fill),var(--palette-grey-200) var(--fill))}
.slider::-moz-range-track{height:4px;border-radius:999px;background:linear-gradient(to right,var(--color-slider-spent) var(--fill),var(--palette-grey-200) var(--fill))}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:999px;border:0;background:var(--color-accent);transition:background-color .15s}
.slider::-moz-range-thumb{width:24px;height:24px;border-radius:999px;border:0;background:var(--color-accent)}
.slider:hover::-webkit-slider-thumb{background:var(--color-accent-hover)}
.segmented{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:4px;border-radius:999px;background:var(--palette-grey-100)}
.segmented__option{position:relative;display:flex;z-index:1}
.segmented__option input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.segmented__label{flex:1;height:48px;padding:0 8px;display:flex;align-items:center;justify-content:center;border-radius:999px;font:600 18px/18px var(--font-body);color:var(--color-text);transition:color .15s}
.segmented::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--count,2));background:var(--palette-birch);border-radius:999px;transform:translateX(calc(var(--index,0) * 100%));transition:transform .26s var(--ease-standard)}
.segmented:has(.segmented__option:nth-child(2) input:checked){--index:1}
.segmented:has(.segmented__option:nth-child(3) input:checked){--index:2}
.calc-row__head{display:flex;justify-content:space-between;align-items:center;gap:24px}
.calc-row__label{font:600 20px/24px var(--font-body);color:var(--color-heading)}
.calc-row .field{width:140px;min-height:56px;flex:0 0 auto}
.calc-row .input{text-align:right}
.calc-row .slider{margin-top:12px}
.choice{display:inline-flex;gap:12px;align-items:flex-start;position:relative;cursor:pointer}
.choice input{position:absolute;inset:0;opacity:0;margin:0}
.choice__box{width:28px;height:28px;border-radius:6px;background:var(--palette-grey-100);display:flex;align-items:center;justify-content:center;color:var(--palette-asphalt)}
.choice__box .icon{width:24px;height:24px;display:none}
.choice input:checked~.choice__box .icon{display:block}
.choice input:focus-visible~.choice__box{outline:4px solid var(--color-focus)}
</style>
</head>
<body>

<div class="demo">
  <section><p class="demo-label">Tekstikenttä: tyhjä (vain label), fokuksessa arvo-rivi kasvaa, virhe</p>
  <div style="display:grid;gap:12px;max-width:440px">
    <label class="field"><span class="field__media"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><path d="M12 11.5a2.5 2.5 0 1 0 0-5"/></svg></span><span class="field__body"><span class="field__label">Lähtöpaikka</span><span class="field__value"><input class="input" placeholder="Kirjoita osoite"></span></span></label>
    <label class="field"><span class="field__media"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h12l-2 4 2 4H5"/></svg></span><span class="field__body"><span class="field__label">Määränpää</span><span class="field__value"><input class="input" value="Esimerkkikatu 1"></span></span></label>
    <label class="field field--error"><span class="field__body"><span class="field__label">Sähköposti</span><span class="field__value"><input class="input" value="virheellinen"></span></span></label>
  </div></section>
  <section style="background:var(--palette-grey-300);padding:48px;border-radius:24px"><p class="demo-label" style="color:var(--palette-asphalt)">Hintalomake (quote bar) + notch join</p>
  <form class="quote-bar" style="--input-surface:var(--palette-birch)">
    <div class="quote-bar__group">
      <label class="field"><span class="field__media"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><path d="M12 11.5a2.5 2.5 0 1 0 0-5"/></svg></span><span class="field__body"><span class="field__label">Lähtöpaikka</span><span class="field__value"><input class="input" placeholder=" "></span></span></label>
      <svg class="notch notch--row" viewBox="0 0 16 32" width="16" height="32" aria-hidden="true"><path d="M0 0C0 4.4 3.6 8 8 8s8-3.6 8-8v32c0-4.4-3.6-8-8-8s-8 3.6-8 8z"/></svg><svg class="notch notch--col" viewBox="0 0 32 16" width="32" height="16" aria-hidden="true"><path d="M32 0c-4.4 0-8 3.6-8 8s3.6 8 8 8H0c4.4 0 8-3.6 8-8S4.4 0 0 0z"/></svg>
      <label class="field"><span class="field__media"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h12l-2 4 2 4H5"/></svg></span><span class="field__body"><span class="field__label">Määränpää</span><span class="field__value"><input class="input" placeholder=" "></span></span></label>
    </div>
    <button class="btn btn--primary" type="submit">Katso hinta</button>
  </form></section>
  <section style="max-width:528px"><p class="demo-label">Segmented + laskurin syöterivi + slider</p>
    <div class="segmented" style="--count:2"><label class="segmented__option"><input type="radio" name="s" checked><span class="segmented__label">Vaihtoehto A</span></label><label class="segmented__option"><input type="radio" name="s"><span class="segmented__label">Vaihtoehto B</span></label></div>
    <div class="calc-row" style="margin-top:24px"><div class="calc-row__head"><span class="calc-row__label">Määrä kuukaudessa</span><label class="field"><span class="field__body"><span class="field__value" style="height:24px;opacity:1"><input class="input" value="40" inputmode="numeric"></span></span></label></div><input class="slider" type="range" min="0" max="100" value="40" data-slider></div>
  </section>
  <section><p class="demo-label">Checkbox</p><label class="choice"><input type="checkbox" checked><span class="choice__box"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg></span><span>Hyväksyn ehdot</span></label></section>
</div>

<script src="../motion/motion.js" defer></script>
</body>
</html>
