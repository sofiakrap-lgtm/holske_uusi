<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badges and tags · ui-bahnexpress-fi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Figtree:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../motion/motion.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-weight:var(--weight-body);font-size:var(--text-body);line-height:var(--leading-body);font-feature-settings:var(--body-features);-webkit-font-smoothing:antialiased}
.demo-label{font:600 14px/20px var(--font-mono);color:var(--color-text-muted);margin:0 0 var(--space-4)}
.demo{padding:var(--space-9) var(--container-pad);display:flex;flex-direction:column;gap:var(--space-9)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center}
.section{background:var(--color-bg);color:var(--color-text);padding:var(--section-py) 0;overflow-x:clip}
.container{max-width:var(--container-max);margin:0 auto;padding-inline:var(--container-pad);display:flex;flex-direction:column;gap:var(--section-gap)}
.display{font-family:var(--font-display);font-stretch:var(--stretch-display);font-size:var(--text-h1);line-height:var(--leading-h1);letter-spacing:var(--tracking-h1);font-weight:var(--weight-h1);text-transform:var(--case-display);color:var(--color-heading);text-wrap:balance;margin:0}
.heading{font-family:var(--font-heading);font-stretch:var(--stretch-display);font-size:var(--text-h3);line-height:var(--leading-h3);letter-spacing:var(--tracking-h3);font-weight:var(--weight-h3);color:var(--color-heading);text-wrap:balance;margin:0}
.eyebrow{font-family:var(--font-body);font-weight:var(--weight-caption);font-size:var(--text-caption);line-height:var(--leading-caption);color:var(--color-text-muted);margin:0}
.lead{font-weight:var(--weight-lead);font-size:var(--text-lead);line-height:var(--leading-lead);color:var(--color-heading);margin:0;text-wrap:balance}
.body{margin:0;text-wrap:pretty}
.muted{color:var(--color-text-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--button-gap);height:var(--button-h);padding:0 var(--button-px);border:0;border-radius:var(--radius-button);font:var(--weight-button) var(--text-button)/var(--leading-button) var(--font-body);white-space:nowrap;cursor:pointer;text-decoration:none;background:transparent;color:inherit;transition:background-color var(--duration-fast),color var(--duration-fast)}
.btn:focus-visible{outline:4px solid var(--color-focus);outline-offset:0}
.btn--primary{background:var(--color-accent);color:var(--color-accent-contrast)}
.btn--primary:hover,.btn--primary.is-hover{background:var(--color-accent-hover)}
.btn--secondary{background:var(--color-surface);color:var(--color-heading)}
.btn--secondary:hover,.btn--secondary.is-hover{background:var(--palette-grey-100)}
.btn--tertiary{background:var(--palette-grey-100);color:var(--palette-asphalt)}
.btn--tertiary:hover,.btn--tertiary.is-hover{background:var(--palette-grey-200)}
.btn--ghost{color:var(--color-heading);padding-inline:calc(var(--button-px) - 2px)}
.btn--ghost:hover,.btn--ghost.is-hover{color:var(--color-link-hover)}
.btn--xs{--button-h:40px;--button-px:20px;--text-button:16px;--leading-button:16px}
.btn--sm{--button-h:48px;--button-px:22px;--text-button:18px;--leading-button:18px}
.btn--lg{--button-h:64px;--button-px:28px;--text-button:22px;--leading-button:22px}
.btn--xl{--button-h:72px;--button-px:32px;--text-button:24px;--leading-button:24px}
.btn--icon{width:var(--button-h);padding:0}
.btn:disabled{background:var(--color-bg-alt);color:var(--color-text-muted);cursor:not-allowed}
.icon{width:var(--icon-size);height:var(--icon-size);fill:none;stroke:currentColor;stroke-width:var(--icon-stroke);stroke-linecap:square;stroke-linejoin:miter;flex:0 0 auto}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid currentColor;border-radius:var(--radius-pill);font:400 16px/16px var(--font-body);color:var(--color-text-muted);white-space:nowrap}
.ph{background:var(--palette-grey-100);display:block;width:100%}

.tag--s{height:20px;padding:0 6px;font-size:14px;line-height:14px}
.tag--l{height:28px;padding:0 10px;font-size:18px;line-height:18px}
.tag--xl{height:32px;padding:0 12px;font-size:20px;line-height:20px}
.tag--headline{color:var(--color-heading)}
.icon-tile{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:16px;background:var(--color-surface);color:var(--color-text-muted)}
.icon-tile .icon{width:40px;height:40px;stroke-width:1.2}
.digit{display:inline-flex;align-items:center;justify-content:center;min-height:80px;padding:26px 16px;border-radius:12px;background:var(--color-surface);font:700 24px/28px var(--font-mono);color:var(--color-heading)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px 2px 2px;border-radius:8px;background:var(--palette-asphalt);color:var(--palette-birch);font:300 14px/20px var(--font-body)}
.badge__media{width:32px;height:32px;border-radius:8px;background:var(--palette-grey-700)}
</style>
</head>
<body>

<div class="demo">
  <div class="row"><span class="tag tag--s">tag s</span><span class="tag">tag m</span><span class="tag tag--l">tag l</span><span class="tag tag--xl tag--headline">tag xl</span></div>
  <div class="row"><span class="icon-tile"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><path d="M12 11.5a2.5 2.5 0 1 0 0-5"/></svg></span><span class="icon-tile"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h12l-2 4 2 4H5"/></svg></span><span class="digit">4</span><span class="digit">2</span><span class="badge"><span class="badge__media"></span>Merkki</span></div>
</div>

<script src="../motion/motion.js" defer></script>
</body>
</html>
